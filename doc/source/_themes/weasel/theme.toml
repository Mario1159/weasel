[theme]
inherit = "basic"
stylesheets = [
    "weasel.css",
]
sidebars = [
    "logo.html",
    "searchbox.html",
    "globaltoc.html",
    "sourcelink.html",
]
pygments_style = { default = "sphinx" }

[options]
nosidebar = "false"
sidebarwidth = "250"
body_min_width = "360"
body_max_width = "800"
navigation_with_keys = "True"
enable_search_shortcuts = "True"
globaltoc_collapse = "true"
globaltoc_includehidden = "false"
globaltoc_maxdepth = "4"
