name: Deploy Documentation

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    env:
      XMAKE_ROOT: y

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel git clang cmake ninja python python-sphinx nodejs

      - name: Install yay and AUR packages
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          su - builder -c "
            git clone https://aur.archlinux.org/yay-bin.git /tmp/yay-bin &&
            cd /tmp/yay-bin &&
            makepkg -si --noconfirm &&
            yay -S --noconfirm python-sphinx-hawkmoth
          "

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure
        run: xmake f -y

      - name: Build docs
        run: xmake build docs

      - name: Dump failed package logs
        if: failure()
        shell: bash
        run: |
          echo "=== failed package logs ==="
          # xmake's global dir is ~/.xmake on unix but %LOCALAPPDATA%/.xmake
          # on Windows (git-bash needs backslashes converted).
          for base in "${HOME}/.xmake" "${LOCALAPPDATA//\\//}/.xmake" "/github/home/.xmake" "/root/.xmake"; do
            [ -d "$base" ] || continue
            echo "--- searching $base ---"
            find "$base" \( -path '*.failed/logs/*' -o -path '*.failed/*' \) \( -name '*.txt' -o -name '*.log' \) -print 2>/dev/null | while IFS= read -r f; do
              echo "===== $f (error lines) ====="
              grep -i -E "error|failed|undefined|killed|out of memory|cannot|no such|not found" "$f" | head -n 40 || true
              echo "----- $f (tail) -----"
              tail -n 80 "$f"
            done
          done
          echo "=== end ==="

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
