name: Deploy Documentation

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: this job deliberately bypasses xmake. The docs target needs
      # no engine packages (just python3 + sphinx), while `xmake f -y`
      # would resolve and build the entire GUI stack (dual SDL, X11,
      # wayland, mesa...) from source — 40+ minutes that once deadlocked
      # on a package lock. The commands below mirror xmake.lua's docs
      # target exactly (same script, same sphinx args).
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          # clang stays: hawkmoth parses C++ via libclang, and conf.py
          # globs toolchain includes (/usr/lib/clang, /usr/include/c++).
          # cmake/ninja/nodejs are not needed for docs.
          pacman -S --noconfirm \
            base-devel git clang python python-sphinx

      - name: Install yay and AUR packages
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          su - builder -c "
            git clone https://aur.archlinux.org/yay-bin.git /tmp/yay-bin &&
            cd /tmp/yay-bin &&
            makepkg -si --noconfirm &&
            yay -S --noconfirm python-sphinx-hawkmoth
          "

      - name: Generate API docs
        run: python3 doc/source/das_api_gen.py --source src --output doc/source/stdlib

      - name: Build docs
        run: sphinx-build --keep-going -b html doc/source build/docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
