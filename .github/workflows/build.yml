name: Build

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            container: archlinux:latest
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
      fail-fast: false

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/xmake-action@v1
        with:
          xmake-version: latest

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/.xmake
          key: ${{ runner.os }}-xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            ${{ runner.os }}-xmake-

      - name: Install dependencies (Linux)
        if: matrix.name == 'linux'
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel git clang cmake ninja python nodejs pkgconf \
            libx11 libxext libxrandr libxcursor libxfixes libxi libxss libxtst libxinerama libxkbcommon libxrender \
            alsa-lib libpulse mesa \
            opus opusfile libvorbis flac libgme mpg123 fluidsynth wavpack \
            brotli zlib freetype2 openssl protobuf libsodium \
            libavif libtiff libwebp libpng libjpeg-turbo \
            abseil-cpp re2 nlohmann-json boost

      - name: Install dependencies (Windows)
        if: matrix.name == 'windows'
        run: |
          choco install llvm python nodejs ninja cmake -y

      - name: Setup MSVC dev environment (Windows)
        if: matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (macOS)
        if: matrix.name == 'macos'
        run: |
          brew update
          brew install llvm python node cmake ninja pkg-config

      - name: Configure
        run: xmake f -y --toolchain=clang
        # Shaders are compiled with slangc (--with_slang=y). Left disabled to
        # keep CI lean; set it here if compiled_shaders must ship in artifacts.

      - name: Build
        run: xmake build -j4

      - name: Test
        run: xmake run -g tests

      - name: Collect artifacts (Linux / macOS)
        if: matrix.name != 'windows'
        shell: bash
        run: |
          mkdir -p artifacts/bin artifacts/lib artifacts/share/weasel
          cp build/*/*/release/weasel build/*/*/release/weasel-cli build/*/*/release/weasel-mcp-server artifacts/bin/
          cp build/*/*/release/libwsl.a artifacts/lib/
          cp -r build/otf build/icons artifacts/share/weasel/ 2>/dev/null || true
          cp -r build/compiled_shaders artifacts/share/weasel/ 2>/dev/null || true
          cp packaging/linux/Makefile artifacts/

      - name: Collect artifacts (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          mkdir -p artifacts/bin artifacts/lib artifacts/share/weasel
          cp build/*/*/release/weasel.exe build/*/*/release/weasel-cli.exe build/*/*/release/weasel-mcp-server.exe artifacts/bin/
          cp build/*/*/release/libwsl.a artifacts/lib/
          cp -r build/otf build/icons artifacts/share/weasel/ 2>/dev/null || true
          cp -r build/compiled_shaders artifacts/share/weasel/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weasel-release-${{ matrix.name }}
          path: artifacts/**
