name: Build

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

env:
  # Enable vcpkg binary caching via GitHub Actions cache
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            container: archlinux:latest
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
      fail-fast: false

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.name == 'linux'
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel git cmake ninja \
            sdl3 libarchive glm pkgconf \
            opus opusfile libvorbis flac libgme mpg123 fluidsynth wavpack \
            brotli zlib freetype2 openssl protobuf libsodium \
            libavif libtiff libwebp libpng libjpeg-turbo \
            abseil-cpp re2 gtest nlohmann-json boost \
            llvm clang python nodejs

      - name: Configure (Linux)
        if: matrix.name == 'linux'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM20_PREFIX=/usr \
            -G Ninja

      - name: Install dependencies (Windows)
        if: matrix.name == 'windows'
        run: |
          choco install llvm python nodejs nsis
          vcpkg install sdl3 libarchive glm pkgconf openssl protobuf libsodium boost freetype directx-dxc --triplet x64-windows
          Add-Content -Path $env:GITHUB_PATH -Value "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\tools\directx-dxc"

      - name: Configure (Windows)
        if: matrix.name == 'windows'
        run: |
          cmake -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DLLVM20_PREFIX="C:\Program Files\LLVM" `
            -G "Visual Studio 17 2022"

      - name: Install dependencies (macOS)
        if: matrix.name == 'macos'
        run: |
          brew update
          brew install sdl3 libarchive glm pkg-config \
            opus opusfile libvorbis flac game-music-emu mpg123 fluid-synth wavpack \
            jpeg-turbo libpng libtiff webp libavif \
            brotli zlib freetype openssl protobuf libsodium \
            abseil re2 googletest nlohmann-json boost \
            cmake ninja llvm python node
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libarchive)" >> $GITHUB_ENV

      - name: Configure (macOS)
        if: matrix.name == 'macos'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH;$(brew --prefix)" \
            -DLLVM20_PREFIX="$(brew --prefix llvm)" \
            -G Ninja

      - name: Stage DXC for Slang (Windows)
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          $dxcDir = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\tools\directx-dxc"
          # Copy DXC next to every slangc.exe already present (prebuilt download).
          $slangBins = Get-ChildItem -Recurse -Filter "slangc.exe" build
          if ($slangBins) {
            foreach ($bin in $slangBins) {
              $slangDir = Split-Path $bin.FullName
              Write-Host "Copying DXC to slangc directory: $slangDir"
              Copy-Item "$dxcDir\dxc.exe" "$slangDir\" -ErrorAction SilentlyContinue
              Copy-Item "$dxcDir\dxcompiler.dll" "$slangDir\" -ErrorAction SilentlyContinue
              Copy-Item "$dxcDir\dxil.dll" "$slangDir\" -ErrorAction SilentlyContinue
            }
          }
          # Also stage into Release\bin where MSBuild will run the built slangc.exe.
          $releaseBin = "build\Release\bin"
          New-Item -ItemType Directory -Force -Path $releaseBin | Out-Null
          Copy-Item "$dxcDir\dxc.exe" "$releaseBin\" -ErrorAction SilentlyContinue
          Copy-Item "$dxcDir\dxcompiler.dll" "$releaseBin\" -ErrorAction SilentlyContinue
          Copy-Item "$dxcDir\dxil.dll" "$releaseBin\" -ErrorAction SilentlyContinue
          Write-Host "Staged DXC into $releaseBin"
          # Ensure PATH contains the directories where dxc.exe lives so Slang can find it.
          $env:Path = "$releaseBin;$dxcDir;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value "$releaseBin"
          Add-Content -Path $env:GITHUB_PATH -Value "$dxcDir"

      - name: Test Slang + DXC directly (Windows)
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          $slangc = (Get-ChildItem -Recurse -Filter "slangc.exe" build | Select-Object -First 1).FullName
          $slangDir = Split-Path $slangc
          Write-Host "Using slangc: $slangc"
          Write-Host "=== Checking dxc next to slangc ==="
          Get-ChildItem $slangDir -Filter "dxc*" -ErrorAction SilentlyContinue | Format-Table Name
          Write-Host "=== Testing simple shader compilation ==="
          Set-Content -Path test.vert.slang -Value '[shader("vertex")]' -Encoding ASCII
          Add-Content -Path test.vert.slang -Value 'float4 main() : SV_Position { return float4(0,0,0,1); }' -Encoding ASCII
          $env:Path = "$slangDir;$env:Path"
          & $slangc test.vert.slang -target dxil -profile vs_6_0 -o test.vert.dxil -Xdxc -Vd 2>&1 | Write-Host
          Write-Host "=== Listing test output ==="
          Get-ChildItem test.vert* -ErrorAction SilentlyContinue | Format-Table Name, Length

      - name: Build (Linux / macOS)
        if: matrix.name != 'windows'
        run: cmake --build build

      - name: Build (Windows)
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          $dxcPath = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\tools\directx-dxc\dxc.exe"
          if (-Not (Test-Path $dxcPath)) {
            Write-Error "DXC not found at $dxcPath"
            exit 1
          }
          $env:SLANG_DXC_PATH = $dxcPath
          Write-Host "SLANG_DXC_PATH=$env:SLANG_DXC_PATH"
          cmake --build build --config Release

      - name: Collect artifacts (Linux)
        if: matrix.name == 'linux'
        shell: bash
        run: |
          mkdir -p artifacts/bin artifacts/lib artifacts/share/weasel
          cp build/weasel build/weasel-cli artifacts/bin/
          cp build/libwsl.so artifacts/lib/
          cp -r build/compiled_shaders artifacts/share/weasel/
          cp -r build/otf artifacts/share/weasel/
          cp -r build/icons artifacts/share/weasel/
          cp packaging/linux/Makefile artifacts/

      - name: Collect artifacts (macOS)
        if: matrix.name == 'macos'
        shell: bash
        run: |
          mkdir -p artifacts/bin artifacts/lib
          cp build/weasel build/weasel-cli artifacts/bin/
          cp build/libwsl.dylib artifacts/lib/ 2>/dev/null || true
          cp -L build/*.dylib artifacts/lib/ 2>/dev/null || true
          cp -r build/compiled_shaders build/otf build/icons artifacts/ 2>/dev/null || true

      - name: Collect artifacts (Windows)
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\bin, artifacts\lib | Out-Null
          Copy-Item build\Release\weasel.exe artifacts\bin\ -ErrorAction SilentlyContinue
          Copy-Item build\Release\weasel-cli.exe artifacts\bin\ -ErrorAction SilentlyContinue
          Copy-Item build\Release\wsl.dll artifacts\lib\ -ErrorAction SilentlyContinue
          Copy-Item build\Release\*.dll artifacts\lib\ -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force build\compiled_shaders, build\otf, build\icons artifacts\ -ErrorAction SilentlyContinue

      - name: Package (Linux / macOS / Windows)
        if: matrix.name != 'windows'
        shell: bash
        run: cd build && cpack

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          cd build
          cpack -C Release -G ZIP
          cpack -C Release -G NSIS

      - name: Collect packages
        if: matrix.name != 'windows'
        shell: bash
        run: |
          mkdir -p packages
          cp build/*.tar.gz build/*.deb build/*.rpm build/*.pkg build/*.dmg packages/ 2>/dev/null || true

      - name: Collect packages (Windows)
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path packages | Out-Null
          Copy-Item build\*.exe packages\ -ErrorAction SilentlyContinue
          Copy-Item build\*.zip packages\ -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weasel-release-${{ matrix.name }}
          path: artifacts/**

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: weasel-packages-${{ matrix.name }}
          path: packages/**
